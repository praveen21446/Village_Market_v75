services:
  postgres:
    image: postgres:16
    container_name: village_market_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: village_market
      POSTGRES_USER: village_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - village_market_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U village_market -d village_market"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  village_market_postgres_data:
